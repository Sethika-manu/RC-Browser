name: Build macOS App (Auto Branch Build)

# ඔයා දැනට වැඩ කරන branch එකට push කරපු ගමන් ඉබේම build එක දුවන්න මෙතන push trigger එක දැම්මා
on:
  push:
    branches:
      - test-branch-v1.3.4

jobs:
  build-mac:
    runs-on: macos-latest # GitHub එකෙන් Mac Machine එකක් ගන්නවා

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2

      - name: Build Tauri macOS app
        run: |
          chmod +x node_modules/.bin/*
          npm run tauri build

      - name: Upload macOS Bundle
        uses: actions/upload-artifact@v4
        with:
          name: RC-Browser-Mac-Bundle
          # dmg ෆෝල්ඩර් එකට විතරක් ලොක් කරන්නේ නැතුව, සම්පූර්ණ bundle ෆෝල්ඩර් එකම ගන්නවා
          path: src-tauri/target/release/bundle/